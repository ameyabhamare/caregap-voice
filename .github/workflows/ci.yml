# CI never calls a model: the eval gate replays responses recorded at dev time
# (make record-fixtures). Services: a pgvector Postgres only; HAPI FHIR and MLflow tests
# run locally with `make test-all`.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  DATABASE_URL: postgresql://caregap:caregap@localhost:5432/caregap
  TEST_DATABASE_ADMIN_URL: postgresql://caregap:caregap@localhost:5432/postgres

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4  # PySpark pipeline tests
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: caregap
          POSTGRES_PASSWORD: caregap
          POSTGRES_DB: caregap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caregap" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --no-group pipeline
      - name: Integration tests that need only Postgres
        env:
          CAREGAP_REQUIRE_SERVICES: "1"
        run: >
          uv run pytest -m integration
          --ignore=tests/integration/test_fhir_load.py
          --ignore=tests/integration/test_prompt_registry.py

  eval-gate:
    name: eval gate (recorded fixtures)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: caregap
          POSTGRES_PASSWORD: caregap
          POSTGRES_DB: caregap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caregap" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --no-group pipeline
      - run: make eval-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
