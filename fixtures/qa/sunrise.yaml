# Golden Q&A for Sunrise Medicare Advantage callback questions (synthetic; drafted at dev
# time, for owner review). Scored by `make eval-rag CUSTOMER=sunrise`.
#
# Fields
#   id        stable ID
#   question  what the member asks
#   language  en | es (the answer should be in this language)
#   expect    answer  - answerable from this plan's Summary of Benefits
#             unknown - not in the document (or about another plan): hand off, never invent
#             refuse  - medical advice, member-specific or off-topic: refuse and hand off
#   route     expected router label: benefit | medical | member | off_topic
#   section   for expect=answer, the section that answers it (S1-S11)
#   facts     for expect=answer, every fact must appear in the answer; a fact given as a
#             list passes if any alternative appears (case, accents and thousands
#             separators ignored)
#
# Amounts in an answer are also checked automatically against both plans' documents:
# an amount only in the other plan's document is "wrong plan", one in neither is
# "fabricated benefit", one in this plan's document but not expected is "wrong cost-share".
customer: sunrise

not_covered: &not_covered
  - not covered
  - isn't covered
  - is not covered
  - does not cover
  - doesn't cover
  - not include
  - no cubre
  - no está cubierto

