[project]
name = "caregap"
version = "0.0.1"
description = "Voice outreach agent for health plan care gaps (synthetic data only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "fastapi>=0.115,<0.158",
    "uvicorn>=0.30",
    "mlflow-skinny==3.16.1",
    "anthropic>=1.17,<2",
]

[project.scripts]
# Entry point for the Databricks python_wheel_task (and handy locally).
caregap-pipeline = "caregap.pipeline.job:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]
pipeline = [
    "pyspark==4.0.4",
]
voice = [
    "faster-whisper==1.2.1",
    "kokoro-onnx==0.6.1",
]

[tool.uv]
# The pipeline group (PySpark) is installed for development and tests; the core service
# image can skip it with `uv sync --no-group pipeline`. The voice group (TTS/STT runtimes)
# is installed by default too; CI tests use fakes and never load the models.
default-groups = ["dev", "pipeline", "voice"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caregap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not models'"
markers = [
    "integration: needs running docker compose services (run via `make test-all`)",
    "models: loads real TTS/STT model files from data/cache (run via `make test-all`)",
]
