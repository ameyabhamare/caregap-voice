# Synthea overrides for CareGap Voice. Everything not set here uses Synthea's defaults.
# Run parameters (seed, population, dates, ages) are pinned in caregap/data/synthea.py.

exporter.baseDirectory = /data/synthea/
exporter.fhir.export = true
exporter.fhir.transaction_bundle = true
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

# Measurement year 2025 plus the 2024 lookback for the eye-exam rule. Active conditions
# and medications from earlier years are still exported.
exporter.years_of_history = 2

# Only the resource types the gap logic and references need. Drops the bulky ones
# (ExplanationOfBenefit, Claim, DiagnosticReport, DocumentReference, Provenance, ...).
exporter.fhir.included_resources = Patient,Encounter,Condition,Procedure,Observation,MedicationRequest,Medication,Organization,Practitioner,PractitionerRole,Location

# Members are the living population; deceased handling is covered by edge cases.
generate.only_alive_patients = true

exporter.ccda.export = false
exporter.csv.export = false
exporter.text.export = false
exporter.metadata.export = false
